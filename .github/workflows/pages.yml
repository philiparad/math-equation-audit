name: Validate MathAudit Browser Edition
on:
  push:
    branches: [browser-only]
    paths:
      - 'frontend/**'
      - 'tests/**'
      - 'tools/**'
      - 'package.json'
      - '.github/workflows/pages.yml'
  pull_request:
    branches: [browser-only]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: npm run check
      - name: OCR and review tests
        run: npm test
# Live static files are served from philiparad/philiparad.github.io/math-equation-audit.
# This repository is authoritative source; sync validated frontend changes to the hosting repo.
